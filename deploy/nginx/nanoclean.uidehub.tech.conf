# ==========================================================================
# Nginx · nanoclean.uidehub.tech  ->  sitio estático (Next.js export)
#
# La app se compila con `output: "export"` y genera la carpeta `out/`.
# Nginx la sirve directamente (sin puerto, sin proceso), igual que el resto
# de frontends del servidor.
#
# Detalle importante: el export crea `dashboard.html`, `clasificacion.html`,
# `dashboard/contenedores/C-01.html`, etc. (NO carpetas con index.html). Por eso
# el try_files prueba también `$uri.html`, para que /dashboard -> dashboard.html.
#
# Copiar a:  /etc/nginx/sites-available/nanoclean
# Activar :  sudo ln -s /etc/nginx/sites-available/nanoclean /etc/nginx/sites-enabled/nanoclean
# ==========================================================================

server {
    listen 80;
    listen [::]:80;

    server_name nanoclean.uidehub.tech;

    root /srv/apps/nanoclean_frontend/out;
    index index.html;

    # Assets versionados con hash: cache larga e inmutable
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # /dashboard -> dashboard.html ; /dashboard/nodos/NODE-01 -> NODE-01.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    access_log /var/log/nginx/nanoclean-access.log;
    error_log  /var/log/nginx/nanoclean-error.log;
}
