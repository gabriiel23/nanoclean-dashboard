# ==========================================================================
# Nginx · nanoclean.uidehub.tech  ->  contenedor Next.js (127.0.0.1:3001)
#
# Este es el bloque INICIAL en HTTP (puerto 80). NO añadas aquí el 443 ssl
# a mano: se deja funcionando en HTTP y luego `certbot --nginx` inserta el
# bloque 443 y la redirección automáticamente.
#
# Copiar a:  /etc/nginx/sites-available/nanoclean
# Activar :  sudo ln -s /etc/nginx/sites-available/nanoclean /etc/nginx/sites-enabled/nanoclean
# ==========================================================================

server {
    listen 80;
    listen [::]:80;

    server_name nanoclean.uidehub.tech;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte de WebSocket (el dashboard usa socket.io)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/nanoclean-access.log;
    error_log  /var/log/nginx/nanoclean-error.log;
}
